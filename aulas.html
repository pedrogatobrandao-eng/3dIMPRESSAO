<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impressão 3D Lucrativa — Plataforma do Curso</title>
<style>
:root{--bg:#fff;--fg:#14161a;--mut:#5b6270;--card:#f4f6fa;--bd:#e1e5ec;--ac:#ff6a1a;--ac2:#ffb347;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d10;--fg:#f2f4f8;--mut:#9aa3b2;--card:#14171c;--bd:#232832}}
:root[data-theme="dark"]{--bg:#0b0d10;--fg:#f2f4f8;--mut:#9aa3b2;--card:#14171c;--bd:#232832}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#rp{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:9}
.app{display:grid;grid-template-columns:310px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:19px;cursor:pointer}.brand b{color:var(--ac)}
.bar{height:8px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.mh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 6px 6px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--fg);font:inherit;font-size:14px;line-height:1.35;cursor:pointer}
.it:hover{background:var(--bg)}.it.on{background:var(--bg);border-color:var(--ac)}
.n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;font-weight:700}
.it.dn .n{background:var(--ok);border-color:var(--ok);color:#fff}
main{padding:0 0 40px;min-width:0}.in{max-width:780px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.hero{background:linear-gradient(135deg,#1b0f06,#3a1a08 55%,#ff6a1a);color:#fff;padding:56px 0 48px}
.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.1;margin:14px 0}.hero p{color:#ffe2cc;max-width:560px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stats div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 16px;font-size:14px}.stats b{display:block;font-size:22px}
.cta{display:inline-block;background:#fff;color:#1a1005;border:0;font:inherit;font-weight:700;padding:14px 24px;border-radius:12px;cursor:pointer}
.mods{display:grid;gap:16px;margin:30px 0}
.mod{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}.mod h3{margin:0 0 4px}.mod .mut{font-size:15px;margin:0 0 10px;line-height:1.5}
.mut{color:var(--mut)}.tag{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--mut);margin-right:6px;line-height:1.7}
.lh{padding:40px 0 10px;border-bottom:1px solid var(--bd);margin-bottom:10px}.lh h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:12px 0}
.obj{border-left:4px solid var(--ac);background:var(--card);padding:14px 18px;border-radius:0 12px 12px 0;margin:18px 0}
h2{display:flex;gap:12px;align-items:center;font-size:23px;line-height:1.25;margin:42px 0 12px}h2 span{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1005;display:grid;place-items:center;font-size:16px}
p{margin:0 0 14px}ul,ol{padding-left:22px;margin:0 0 14px}li{margin:6px 0}
.c{border-radius:12px;padding:14px 16px;margin:18px 0;background:var(--card);border:1px solid var(--bd)}.c.t{border-left:4px solid var(--ok)}.c.w{border-left:4px solid var(--no)}.c.e{border-left:4px solid var(--ac)}.c b:first-child{display:block;margin-bottom:2px}
.tw{overflow-x:auto;margin:16px 0}table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px;line-height:1.5}th,td{border:1px solid var(--bd);padding:9px 11px;text-align:left;vertical-align:top}th{background:var(--card)}
.calc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:20px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.g label{font-size:13px;color:var(--mut);display:block;line-height:1.3}.g input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.res div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:14px}.res b{display:block;font-size:26px;color:var(--ac);line-height:1.3}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:30px 0}
.o{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;cursor:pointer}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--bg))}
.nav{display:flex;gap:10px;justify-content:space-between;margin:28px 0;flex-wrap:wrap}
.b{padding:12px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:250px}}
</style>
</head>
<body>
<div id="rp"></div>
<div class="app">
<aside><div class="brand" onclick="home()">🖨️ Impressão 3D <b>Lucrativa</b></div><div class="bar"><i id="pb"></i></div><div class="mut" style="font-size:13px" id="pt"></div><div id="nav"></div></aside>
<main id="m"></main>
</div>
<script>
var M=[["Módulo 1 · Comece certo","Do produto certo à primeira peça e aos modelos exclusivos.",[0,1,2]],["Módulo 2 · Lucro em cada peça","Preço, produto campeão e eficiência de produção.",[3,4,5]],["Módulo 3 · Vire negócio","Estrutura, vendas, calibração avançada e funil.",[6,7,8,9]]];
var L=[
{t:"Como encontrar produtos em alta",d:"Resumo",o:"Descobrir o que vende, validar a demanda e escolher um nicho sem violar direitos autorais.",
ch:[["Onde pesquisar","<p>Use os mais vendidos do Mercado Livre e da Shopee, Pinterest, TikTok e os rankings do Printables e Thingiverse. Os rankings servem de inspiração, nunca de cópia.</p>"],["Como validar","<p>Busque o termo no marketplace. Muitos anúncios com muitas vendas indicam demanda real. Poucos anúncios com vendas indicam oportunidade. Muitos anúncios sem vendas indicam mercado saturado.</p>"],["Nicho e licença","<p>Organizadores, suportes, decoração, personalizados e articulados costumam girar. Só venda modelos com licença comercial e evite personagens protegidos.</p>"]],
q:["Qual sinal indica oportunidade?",["Muitos anúncios sem nenhuma venda","Poucos anúncios com vendas","Qualquer personagem famoso"],1]},
{t:"Do zero à primeira peça",d:"Aula completa",o:"Preparar a máquina, entender cada ajuste do fatiador, acertar a primeira camada e imprimir uma peça de teste dentro da medida, sabendo diagnosticar os erros mais comuns.",
ch:[["O que você precisa antes de ligar","<p>Antes de qualquer impressão, organize o ambiente. Você precisa de uma bancada firme (vibração estraga camadas), um local ventilado e longe de corrente de ar direta, e de alguns itens simples que vão te acompanhar sempre:</p><ul><li><b>Espátula e alicate de corte:</b> para retirar a peça e cortar suportes.</li><li><b>Paquímetro:</b> é o seu instrumento de verdade. Sem medir, você não calibra.</li><li><b>Álcool isopropílico:</b> limpa a mesa e é a solução para metade dos problemas de aderência.</li><li><b>Filamento PLA seco:</b> o ideal para começar.</li></ul><div class='c t'><b>💡 Dica</b>Compre um carretel de PLA de boa marca para aprender. Filamento muito barato ou velho confunde o diagnóstico: você não sabe se o problema é a máquina ou o material.</div>"],
["Montagem e nivelamento","<p>Siga o manual do fabricante para montar e confira se todos os parafusos e correias estão firmes. Depois vem o nivelamento, que define a distância entre o bico e a mesa na primeira camada.</p><ol><li>Aqueça a mesa e o bico na temperatura de uso (a mesa dilata e muda a altura).</li><li>Em máquinas com nivelamento automático, rode o procedimento do fabricante. Nas manuais, ajuste os quatro cantos com uma folha de papel: ela deve passar com leve atrito.</li><li>Limpe a mesa com álcool antes de cada impressão.</li></ol><p>A distância ideal é pequena: o bico precisa esmagar levemente o filamento contra a mesa para ele grudar.</p>"],
["Escolhendo o filamento","<p>O material muda a temperatura, a dificuldade e o resultado. Esta tabela traz faixas típicas. Siga sempre o rótulo do seu carretel, que é a referência correta.</p><div class='tw'><table><tr><th>Material</th><th>Bico (típico)</th><th>Mesa (típico)</th><th>Dificuldade</th><th>Melhor uso</th></tr><tr><td>PLA</td><td>190–220 °C</td><td>50–60 °C</td><td>Fácil</td><td>Decoração, protótipos, a maioria das peças</td></tr><tr><td>PETG</td><td>230–250 °C</td><td>70–85 °C</td><td>Média</td><td>Peças mais resistentes e funcionais</td></tr><tr><td>ABS</td><td>240–260 °C</td><td>90–110 °C</td><td>Difícil (precisa de câmara fechada)</td><td>Peças técnicas e que aguentam calor</td></tr><tr><td>TPU</td><td>210–230 °C</td><td>40–60 °C</td><td>Média (impressão lenta)</td><td>Peças flexíveis</td></tr></table></div><div class='c w'><b>⚠️ Atenção</b>Filamento úmido é o vilão silencioso. Ele estala ao imprimir, deixa bolhas e fiozinhos. Guarde sempre em pote fechado com sílica e seque em estufa se necessário.</div>"],
["Entendendo o fatiador","<p>O fatiador transforma o modelo 3D em instruções de camadas. Estes são os ajustes que realmente importam:</p><ul><li><b>Altura de camada:</b> 0,2 mm é o equilíbrio entre qualidade e tempo. Menor deixa mais liso e mais lento.</li><li><b>Paredes (perímetros):</b> definem a resistência. Use 2 a 3 para começar.</li><li><b>Camadas de topo e fundo:</b> 4 a 5 evitam furos nas superfícies.</li><li><b>Preenchimento:</b> 15 a 20% basta para a maioria das peças decorativas.</li><li><b>Velocidade:</b> comece no perfil padrão do fabricante. Velocidade alta sem calibrar gera falhas.</li><li><b>Suportes:</b> sustentam partes no ar. Reoriente a peça para precisar de menos.</li><li><b>Brim (borda):</b> aumenta a aderência de peças com pouca base.</li></ul>"],
["A primeira camada","<p>Quem acerta a primeira camada elimina a maior parte dos erros. Observe a impressão do começo ao fim da camada inicial.</p><ul><li><b>Correta:</b> linhas coladas umas nas outras, lisas e levemente achatadas, sem espaços.</li><li><b>Alta demais:</b> linhas redondas e separadas que se soltam da mesa. Aproxime o bico (ajuste do Z-offset).</li><li><b>Baixa demais:</b> linhas muito finas e ásperas, ou o bico arranhando a mesa. Afaste um pouco.</li></ul><div class='c e'><b>📌 Exemplo</b>Se a primeira camada solta no meio da peça, pause, limpe a mesa com álcool e reduza o Z-offset em pequenos passos de 0,02 mm até as linhas grudarem.</div>"],
["Imprimindo e medindo o cubo","<p>Fatie um cubo de 20 mm com o perfil padrão e imprima. Quando esfriar, meça os três eixos (X, Y e Z) com o paquímetro e anote:</p><ul><li>Diferença de até cerca de 0,2 mm costuma ser aceitável para peças comuns.</li><li>Medidas muito menores ou maiores indicam problema de fluxo, passos do motor ou temperatura (veremos na aula de calibração).</li><li>Cantos arredondados demais ou sulcos nas laterais indicam ajuste de aceleração, velocidade ou correias.</li></ul>"],
["Diagnóstico rápido","<div class='tw'><table><tr><th>Sintoma</th><th>Causa provável</th><th>Solução</th></tr><tr><td>Peça não gruda</td><td>Mesa suja ou bico longe</td><td>Limpar com álcool e refazer o nivelamento</td></tr><tr><td>Fiozinhos entre partes</td><td>Filamento úmido ou retração baixa</td><td>Secar o filamento e ajustar retração</td></tr><tr><td>Cantos levantando</td><td>Mesa fria ou corrente de ar</td><td>Aumentar a temperatura da mesa, usar brim e proteger de vento</td></tr><tr><td>Camadas falhando</td><td>Bico entupido ou filamento enroscado</td><td>Limpar o bico e conferir o carretel</td></tr><tr><td>Superfície ondulada</td><td>Vibração ou velocidade excessiva</td><td>Apoiar a máquina e reduzir velocidade</td></tr></table></div><div class='c t'><b>✅ Tarefa da aula</b>Imprima o cubo de 20 mm, meça nos três eixos, anote os resultados e fotografe a primeira camada. Esse registro vira sua linha de base para as próximas calibrações.</div>"]],
q:["Qual é a causa nº 1 de peça que não gruda?",["Mesa suja ou com gordura","Cor do filamento","Peça muito pequena"],0]},
{t:"Como modelar peças exclusivas usando IA",d:"Resumo",o:"Usar IA para criar modelos próprios, corrigir o resultado e deixá-lo pronto para impressão.",
ch:[["Fluxo de criação","<p>Ideia, imagem de referência gerada por IA, gerador de modelo 3D a partir de imagem ou texto, correção em Blender ou Tinkercad e fatiamento.</p>"],["Revisão da malha","<p>Confira se a malha está fechada, se as paredes têm ao menos 1,2 mm e se há base plana. Modelos de IA raramente saem prontos.</p>"],["Exclusividade e licença","<p>Personalize com nome, medida ou cor. Leia os termos de uso comercial da ferramenta antes de vender.</p>"]],
q:["O que conferir antes de imprimir um modelo de IA?",["Só a cor","Malha fechada, espessura mínima e base plana","Nada, ele sai pronto"],1]},
{t:"Como precificar suas peças",d:"Aula completa",o:"Calcular o custo real de cada peça, entender a diferença entre margem e markup e definir um preço que cubra taxas, falhas e ainda gere lucro.",
ch:[["Por que a maioria erra o preço","<p>O erro clássico é pegar o custo do filamento, multiplicar por dois e chamar de preço. Isso ignora energia, falhas, embalagem, taxa da plataforma, imposto, frete e o seu próprio tempo. O resultado é vender muito e lucrar pouco, ou até pagar para trabalhar.</p><p>Outro erro comum é confundir <b>markup</b> (percentual sobre o custo) com <b>margem</b> (percentual sobre o preço de venda). As taxas da plataforma e o seu lucro incidem sobre o <b>preço de venda</b>, então a conta correta é:</p><div class='c e'><b>📌 Fórmula</b>Preço de venda = Custo ÷ (1 − taxa − margem)</div>"],
["A anatomia do custo","<ul><li><b>Material:</b> gramas da peça × preço do kg ÷ 1000.</li><li><b>Energia:</b> potência em kW × horas × preço do kWh.</li><li><b>Embalagem:</b> caixa, enchimento e etiqueta.</li><li><b>Falhas:</b> nem toda impressão dá certo. Some um percentual para cobrir material perdido (10 a 15% é um bom ponto de partida).</li><li><b>Desgaste da máquina:</b> valor da impressora ÷ vida útil estimada em horas, multiplicado pelas horas da peça.</li><li><b>Taxa da plataforma e imposto:</b> variam. Confira os valores atuais antes de calcular.</li><li><b>Seu tempo:</b> modelagem, acabamento, fotos e envio.</li></ul>"],
["Exemplo completo com números","<p>Peça de 80 g, filamento a R$ 100/kg, 5 horas de impressão, impressora de 150 W, energia a R$ 1,00/kWh, embalagem de R$ 2,00, falhas de 15%, impressora de R$ 3.000 com vida útil de 5.000 horas, taxa de 20% e margem de 30%.</p><div class='tw'><table><tr><th>Item</th><th>Conta</th><th>Valor</th></tr><tr><td>Material</td><td>80 × 100 ÷ 1000</td><td>R$ 8,00</td></tr><tr><td>Energia</td><td>0,15 kW × 5 h × R$ 1,00</td><td>R$ 0,75</td></tr><tr><td>Embalagem</td><td>—</td><td>R$ 2,00</td></tr><tr><td>Falhas (15%)</td><td>10,75 × 1,15</td><td>R$ 12,36</td></tr><tr><td>Desgaste</td><td>(3.000 ÷ 5.000) × 5 h</td><td>R$ 3,00</td></tr><tr><td><b>Custo de produção</b></td><td></td><td><b>R$ 15,36</b></td></tr><tr><td><b>Preço de venda</b></td><td>15,36 ÷ (1 − 0,20 − 0,30)</td><td><b>R$ 30,72</b></td></tr></table></div><p>Conferindo: 20% de 30,72 é a taxa (R$ 6,14), 30% é o lucro (R$ 9,22) e o resto cobre o custo. Os valores são só um exemplo: troque pelos seus.</p>"],
["Calculadora de preço","<p>Preencha com os seus números e veja o preço sugerido.</p><div class='calc'><div class='g'><div><label>Peso da peça (g)</label><input id='c1' type='number' value='80'></div><div><label>Filamento (R$/kg)</label><input id='c2' type='number' value='100'></div><div><label>Tempo (horas)</label><input id='c3' type='number' value='5'></div><div><label>Potência (W)</label><input id='c4' type='number' value='150'></div><div><label>Energia (R$/kWh)</label><input id='c5' type='number' value='1'></div><div><label>Embalagem (R$)</label><input id='c6' type='number' value='2'></div><div><label>Falhas (%)</label><input id='c7' type='number' value='15'></div><div><label>Taxa da plataforma (%)</label><input id='c8' type='number' value='20'></div><div><label>Margem desejada (%)</label><input id='c9' type='number' value='30'></div><div><label>Desgaste (R$/hora)</label><input id='c10' type='number' value='0.6'></div></div><div class='res'><div>Custo de produção<b id='r1'>-</b></div><div>Preço de venda sugerido<b id='r2'>-</b></div></div></div>"],
["Estratégia de preço","<ul><li><b>Compare, mas não copie:</b> veja os concorrentes, porém não entre em guerra de preço baixo. Diferencie por personalização, acabamento e fotos.</li><li><b>Defina um piso:</b> nunca venda abaixo do preço que cobre o custo e a taxa.</li><li><b>Preço psicológico:</b> terminar em ,90 costuma funcionar bem em marketplaces.</li><li><b>Kits e combos:</b> aumentam o valor por pedido e diluem o frete.</li><li><b>Reavalie todo mês:</b> filamento, energia e taxas mudam.</li></ul><div class='c w'><b>⚠️ Erros comuns</b>Esquecer o frete, não somar falhas, usar markup no lugar de margem e não pagar o próprio tempo.</div><div class='c t'><b>✅ Tarefa da aula</b>Calcule o preço das suas 3 peças na calculadora, compare com os anúncios do marketplace e defina o piso de cada uma.</div>"]],
q:["Por que o preço é custo ÷ (1 − taxa − margem)?",["Porque taxa e margem incidem sobre o preço de venda","Porque é mais fácil","Porque o custo muda"],0]},
{t:"Brinquedo articulado do zero",d:"Resumo",o:"Projetar e imprimir um articulado print-in-place com folgas corretas.",
ch:[["Print-in-place","<p>As peças móveis saem impressas já montadas, separadas por uma folga. Folga pequena funde a junta, grande demais deixa solta.</p>"],["Descubra a sua folga","<p>Imprima um teste de dobradiça com folgas de 0,2, 0,3, 0,4 e 0,5 mm e escolha a menor que se move livremente.</p>"],["Orientação e acabamento","<p>Deixe os eixos deitados, use camada 0,2 mm e 3 paredes. Dobre devagar para soltar as juntas e lixe as rebarbas.</p>"]],
q:["Como achar a folga ideal?",["Chutando","Imprimindo um teste com várias folgas","Aumentando muito a folga"],1]},
{t:"Ganhar tempo e economizar material",d:"Resumo",o:"Reduzir tempo e gasto de filamento sem perder qualidade.",
ch:[["Três perfis","<p>Rápido (0,28 mm, 2 paredes, 10%), padrão (0,20 mm, 3 paredes, 15%) e acabamento (0,12 mm, 4 paredes, 20%).</p>"],["Suporte e lote","<p>Reoriente a peça para reduzir suporte e encha a mesa com peças iguais para aproveitar cada impressão.</p>"],["Evite falhas","<p>Filamento seco e primeira camada boa evitam o maior desperdício: peça perdida.</p>"]],
q:["O que gera mais desperdício?",["Falhas de impressão","Usar PLA","Imprimir em lote"],0]},
{t:"O que falta pra virar negócio",d:"Resumo",o:"Estruturar formalização, controle e rotina de produção.",
ch:[["Formalização","<p>Avalie abrir MEI ou CNPJ com atividade adequada. Confira regras e limites atuais no Portal do Empreendedor.</p>"],["Controle e rotina","<p>Planilha de vendas, custos e estoque de filamento. Produção em lotes e manutenção semanal.</p>"],["Catálogo enxuto","<p>Foque em 5 a 10 produtos campeões e só compre outra impressora quando a fila for constante.</p>"]],
q:["Quando comprar a segunda impressora?",["Logo no início","Quando a fila de pedidos for constante","Nunca"],1]},
{t:"O mapa do produto à venda",d:"Resumo",o:"Percorrer o caminho completo da ideia ao pós-venda.",

function v(i){return parseFloat(document.getElementById('c'+i).value)||0}
